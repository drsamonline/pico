name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]
        exclude:
          # ubuntu-latest no longer ships a 3.8 toolchain; 22.04 still does
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check every file
        run: python -m compileall -q pico.py pico packs tests

      - name: Acceptance tests
        run: python tests/smoke_test.py

      - name: Docs quote the real numbers
        shell: bash
        run: python tools/doc_consistency.py

      - name: Console demo agrees with the engine
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/demo_parity.py

      - name: Zero third-party imports
        shell: bash
        run: |
          python - <<'PY'
          import ast, importlib.util, pathlib, sys, sysconfig
          stdlib_dir = pathlib.Path(sysconfig.get_paths()["stdlib"]).resolve()

          def is_stdlib(name):
              if hasattr(sys, "stdlib_module_names"):      # 3.10+
                  return name in sys.stdlib_module_names
              if name in sys.builtin_module_names or name == "__future__":
                  return True
              try:
                  spec = importlib.util.find_spec(name)
              except Exception:
                  return False
              if not spec or not spec.origin or spec.origin in ("built-in", "frozen"):
                  return name in sys.builtin_module_names
              try:
                  return stdlib_dir in pathlib.Path(spec.origin).resolve().parents
              except Exception:
                  return False

          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              if "tests" in p.parts:
                  continue
              for node in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module.split(".")[0]]
                  for m in mods:
                      if m in ("pico", "packs") or is_stdlib(m):
                          continue
                      bad.append("%s: %s" % (p, m))
          if bad:
              print("\n".join(sorted(set(bad)))); sys.exit(1)
          print("no third-party imports (python %s)" % sys.version.split()[0])
          PY

      - name: Size budget
        shell: bash
        run: python tools/budget.py

      - name: Docs quote the real numbers
        shell: bash
        run: python tools/doc_consistency.py

      - name: Console demo agrees with the engine
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/demo_parity.py

      - name: Zero third-party imports
        shell: bash
        run: |
          python - <<'PY'
          import ast, importlib.util, pathlib, sys, sysconfig
          stdlib_dir = pathlib.Path(sysconfig.get_paths()["stdlib"]).resolve()

          def is_stdlib(name):
              if hasattr(sys, "stdlib_module_names"):      # 3.10+
                  return name in sys.stdlib_module_names
              if name in sys.builtin_module_names or name == "__future__":
                  return True
              try:
                  spec = importlib.util.find_spec(name)
              except Exception:
                  return False
              if not spec or not spec.origin or spec.origin in ("built-in", "frozen"):
                  return name in sys.builtin_module_names
              try:
                  return stdlib_dir in pathlib.Path(spec.origin).resolve().parents
              except Exception:
                  return False

          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              if "tests" in p.parts:
                  continue
              for node in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module.split(".")[0]]
                  for m in mods:
                      if m in ("pico", "packs") or is_stdlib(m):
                          continue
                      bad.append("%s: %s" % (p, m))
          if bad:
              print("\n".join(sorted(set(bad)))); sys.exit(1)
          print("no third-party imports (python %s)" % sys.version.split()[0])
          PY

      - name: Console demo matches the served console
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          for name in ("index.html", "manifest.webmanifest", "sw.js",
                       "icon-192.png", "icon-512.png"):
              a = pathlib.Path("web", name).read_bytes()
              b = pathlib.Path("docs", name if name != "index.html" else "app.html").read_bytes()
              if a != b:
                  sys.exit("docs copy of %s is out of date" % name)
          print("demo, manifest, worker and icons are in sync")
          PY

  smoke-cli:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-shot commands
        run: |
          export PICO_HOME="$RUNNER_TEMP/pico"
          python pico.py add "buy milk"
          python pico.py tasks
          python pico.py emi 500000 8.5 240
          python pico.py --version
          python pico.py dry wa bob hi
          test "$(python pico.py recall nothing)" = "I don't have that."
      - name: Console serves and answers
        run: |
          export PICO_HOME="$RUNNER_TEMP/pico"
          python - <<'PY'
          import json, sys, threading, time, urllib.request
          sys.path.insert(0, ".")
          from http.server import ThreadingHTTPServer
          from pico.engine import Engine
          from pico import ui
          eng = Engine(home=None)
          tok = ui.token_for(eng)
          html = ui.PAGE.read_text().replace("/*__PICO_TOKEN__*/null", json.dumps(tok))
          srv = ThreadingHTTPServer(("127.0.0.1", 8899), ui.make_handler(eng, tok, html))
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.5)
          page = urllib.request.urlopen("http://127.0.0.1:8899/", timeout=5).read().decode()
          assert tok in page, "token not injected"
          req = urllib.request.Request("http://127.0.0.1:8899/cmd",
              data=json.dumps({"token": tok, "text": "emi 500000 8.5 240"}).encode(),
              headers={"Content-Type": "application/json"})
          out = json.loads(urllib.request.urlopen(req, timeout=5).read())["out"]
          assert "4,339" in out, out
          srv.shutdown()
          print("console ok:", out)
          PY
